name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add GitHub secret SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)"
            exit 1
          fi
          supabase functions deploy forecast-data --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy geo-verify --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy wallet-operation --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy ai-advisor --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy create-checkout --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy customer-portal --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy check-subscription --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy redeem-referral --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy verify-identity --project-ref vxcxwmhesgpncbkhwsej --no-verify-jwt
          supabase functions deploy check-bill-reminders --project-ref vxcxwmhesgpncbkhwsej
          supabase functions deploy check-rate-alerts --project-ref vxcxwmhesgpncbkhwsej
