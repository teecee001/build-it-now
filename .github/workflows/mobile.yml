name: Mobile

# Checks the native Expo app in mobile/. Runs only when mobile/ changes, so the
# web CI (ci.yml) and Vercel deploys are unaffected.
on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  push:
    branches: ["**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]

permissions:
  contents: read

jobs:
  check:
    name: Mobile type-check, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - run: npx expo export --platform ios --platform android --output-dir /tmp/export
